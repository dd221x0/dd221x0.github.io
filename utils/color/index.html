<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>color</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>
    <div id="home" class="unselectable">
        <a href="/" class="navigator">
            <div id="triangle" class="home"></div>
        </a>
    </div>
    <div id="form">
        <div class="row unselectable">
            <span id="hex" class="switch active">0x</span>
        </div>
        <div id="colors" class="row unselectable">
            <input id="red" placeholder="R" type="text" name="red">
            <input id="green" placeholder="G" type="text" name="green">
            <input id="blue" placeholder="B" type="text" name="blue">
        </div>
        <div class="row unselectable">
            <div id="preview"></div>
        </div>
        <div class="row unselectable">
            <button id="apply">apply</button>
        </div>
    </div>
    <script type="module" src="scripts.js"></script>
</body>

</html>
