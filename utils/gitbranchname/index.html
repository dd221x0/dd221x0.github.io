<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>gitbranchname</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script src="https://kit.fontawesome.com/5e4a1a8ab9.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="home" class="unselectable">
        <a href="/" class="navigator">
            <div id="triangle" class="home"></div>
        </a>
    </div>
    <div id="form">
        <div class="row unselectable">
            <input id="string" placeholder="string" type="text" name="string">
        </div>
        <div class="row">
            <textarea readonly="readonly" id="result"></textarea>
        </div>
        <div class="row unselectable">
            <div id="copy" class="mainColor empty">
                <i class="fa-solid fa-copy copyIcon"></i>
                <i class="fa-solid fa-check copiedIcon"></i>
            </div>
        </div>
    </div>
    <script type="module" src="scripts.js"></script>
</body>

</html>
